org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# R8 in modalità "full": ottimizzazione più aggressiva di memoria/prestazioni (raccomandazione
# di Google Play Console). Le regole in proguard-rules.pro proteggono già esplicitamente tutte
# le classi che servono a runtime via reflection (modelli Firestore, SDK Maps/Places).
android.enableR8.fullMode=true
# --- Migrazione ad AGP 9.0 ---
# Manteniamo temporaneamente la vecchia DSL e il plugin Kotlin dichiarato esplicitamente
# (invece del "Kotlin integrato" di AGP 9.0): è il percorso di transizione ufficiale Google,
# pensato apposta per aggiornare motore/R8 senza dover riscrivere build.gradle.kts adesso.
android.newDsl=false
android.builtInKotlin=false
# Funzione richiesta da Play Console ("riduzione risorse ottimizzata"): R8 considera insieme
# codice e risorse per rimuoverne di più. Introdotta in AGP 9.0, non disponibile prima.
android.r8.optimizedResourceShrinking=true

