name: iOS Build

on:
  push:
    branches: [ ios ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
      BUNDLE_ID: com.extremecoffee.myapp
    steps:
      - uses: actions/checkout@v4

      - name: Installa XcodeGen + Codemagic CLI tools
        run: |
          brew install xcodegen
          pip3 install codemagic-cli-tools || pip3 install --break-system-packages codemagic-cli-tools
          echo "=== versioni ===" | tee build.log
          xcodegen --version 2>&1 | tee -a build.log
          app-store-connect --version 2>&1 | tee -a build.log || true

      - name: Genera il progetto Xcode
        run: |
          xcodegen generate
          echo "=== schemi disponibili ===" | tee -a build.log
          xcodebuild -project ExtremeCoffee.xcodeproj -list 2>&1 | tee -a build.log

      - name: Build Simulatore (verifica compilazione)
        run: |
          set -o pipefail
          xcodebuild \
            -project ExtremeCoffee.xcodeproj \
            -scheme ExtremeCoffee \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee -a build.log

      - name: Prepara keychain e scarica/crea i file di firma
        run: |
          set -o pipefail
          keychain initialize 2>&1 | tee -a build.log
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create 2>&1 | tee -a build.log
          keychain add-certificates 2>&1 | tee -a build.log
          xcode-project use-profiles --project ExtremeCoffee.xcodeproj 2>&1 | tee -a build.log

      - name: Costruisci l'IPA firmata
        run: |
          set -o pipefail
          xcode-project build-ipa \
            --project ExtremeCoffee.xcodeproj \
            --scheme ExtremeCoffee 2>&1 | tee -a build.log
          ls -lh build/ios/ipa/ 2>&1 | tee -a build.log

      - name: Carica su TestFlight
        run: |
          set -o pipefail
          IPA=$(find build/ios/ipa -name '*.ipa' | head -1)
          echo "IPA da caricare: $IPA" | tee -a build.log
          app-store-connect publish \
            --path "$IPA" \
            --testflight 2>&1 | tee -a build.log

      - name: Pubblica log su branch ioslog
        if: always()
        run: |
          mkdir -p /tmp/l
          cp build.log /tmp/l/ 2>/dev/null || echo "nessun build.log" > /tmp/l/build.log
          grep -niE "error:|error |failed|not authorized|no profiles|no suitable|Provisioning|Signing|Exception" /tmp/l/build.log > /tmp/l/errors.txt || echo "nessun errore trovato" > /tmp/l/errors.txt
          tail -n 250 /tmp/l/build.log > /tmp/l/tail.txt
          cd /tmp/l
          git init -q && git checkout -b ioslog
          git config user.email "bot@extremecoffee.app"; git config user.name "ios-bot"
          git add -A && git commit -q -m "log build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ioslog
